# 前端静态文件 + 后端接口反向代理（同域访问，无需跨域）。
# 生产环境请在前面加 HTTPS（例如云负载均衡、Caddy 或 certbot），WhatsApp Webhook 和支付回调都要求 HTTPS。
server {
    listen 80;
    server_name _;
    client_max_body_size 30m;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 对外公开页面：产品介绍、隐私政策、服务条款、数据删除说明（平台审核要求公开可访问）
    location ~ ^/(about|privacy|terms|data-deletion)/?$ {
        rewrite ^/([a-z-]+)/?$ /admin-api/public/site/$1 break;
        proxy_pass http://backend:48080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin-api/ {
        proxy_pass http://backend:48080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s; # 对话助手、背调等 AI 请求可能较慢
    }

    # 不对外暴露监控与接口文档
    location ~ ^/(actuator|druid|v3/api-docs|doc.html|admin)(/|$) {
        return 404;
    }
}
