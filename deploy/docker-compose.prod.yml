# 生产部署示例：MySQL + Redis + 后端 + Nginx（前端静态文件 + 反向代理）
# 用法见 docs/DEPLOY.md。所有密码从同目录的 .env 读取（复制仓库根目录 .env.example 修改）。
# 数据库和 Redis 不对外暴露端口，只在容器网络内访问。
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: ruoyi-vue-pro
      MYSQL_USER: "${DB_USERNAME:-cgch}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}"
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+08:00"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ../backend/sql/mysql/ruoyi-vue-pro.sql:/docker-entrypoint-initdb.d/01-ruoyi-vue-pro.sql:ro
      - ../backend/sql/mysql/quartz.sql:/docker-entrypoint-initdb.d/02-quartz.sql:ro
      - ../backend/sql/mysql/cgch/00-bpm-schema.sql:/docker-entrypoint-initdb.d/03-bpm-schema.sql:ro
      - ../backend/sql/mysql/cgch/00-crm-schema.sql:/docker-entrypoint-initdb.d/04-crm-schema.sql:ro
      - ../backend/sql/mysql/cgch/00-pay-schema.sql:/docker-entrypoint-initdb.d/05-pay-schema.sql:ro
      - ../backend/sql/mysql/cgch/00-ai-schema.sql:/docker-entrypoint-initdb.d/06-ai-schema.sql:ro
      - ../backend/sql/mysql/cgch/00-channel-schema.sql:/docker-entrypoint-initdb.d/06-channel-schema.sql:ro
      - ../backend/sql/mysql/cgch/01-menu.sql:/docker-entrypoint-initdb.d/07-cgch-menu.sql:ro
      - ../backend/sql/mysql/cgch/02-crm-seed.sql:/docker-entrypoint-initdb.d/08-crm-seed.sql:ro
      - ../backend/sql/mysql/cgch/03-channel-seed.sql:/docker-entrypoint-initdb.d/09-channel-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      retries: 30

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  backend:
    build: ../backend/yudao-server # 先在 backend 目录执行 mvn -pl yudao-server -am package -DskipTests
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: .env
    environment:
      ARGS: "--spring.profiles.active=prod"
      DB_URL: "jdbc:mysql://mysql:3306/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true"
      REDIS_HOST: redis
    volumes:
      - backend-logs:/root/logs

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/apps/web-antd/dist:/usr/share/nginx/html:ro # 先打包前端，见 docs/DEPLOY.md

volumes:
  mysql-data:
  redis-data:
  backend-logs:
