          import socket, base64
          def cpage(q=''):
              return call('GET', f'/channel/wa/conversation/page?pageNo=1&pageSize=50{q}')['list']
          def ws_open(token):
              sk = socket.create_connection(('127.0.0.1', 48080), timeout=10)
              key = base64.b64encode(os.urandom(16)).decode()
              sk.sendall((f"GET /infra/ws?token={token} HTTP/1.1\r\nHost: 127.0.0.1:48080\r\nUpgrade: websocket\r\nConnection: Upgrade\r\n"
                          f"Sec-WebSocket-Key: {key}\r\nSec-WebSocket-Version: 13\r\n\r\n").encode())
              resp = b''
              while b'\r\n\r\n' not in resp:
                  resp += sk.recv(1024)
              head, rest = resp.split(b'\r\n\r\n', 1)
              assert b' 101 ' in head.split(b'\r\n')[0], head
              return sk, rest
          def ws_read(sk, buf):
              def need(n):
                  nonlocal buf
                  while len(buf) < n:
                      chunk = sk.recv(4096)
                      if not chunk:
                          raise SystemExit('WebSocket 被关闭')
                      buf += chunk
              need(2)
              ln, off = buf[1] & 0x7f, 2
              if ln == 126:
                  need(4); ln, off = int.from_bytes(buf[2:4], 'big'), 4
              elif ln == 127:
                  need(10); ln, off = int.from_bytes(buf[2:10], 'big'), 10
              need(off + ln)
              return buf[off:off + ln].decode(), buf[off + ln:]
