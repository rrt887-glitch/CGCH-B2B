          def mraw(method, url, data=None, headers=None):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, method=method, data=data, headers=headers or {}))
                  return r.status, r.read().decode()
              except urllib.error.HTTPError as e:
