          import urllib.error
          def evo():
              return json.load(urllib.request.urlopen('http://127.0.0.1:18080/_evo'))
          def evo_state(name, **kw):
              urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:18080/_evo/state', method='POST',
                  data=json.dumps(dict(kw, instance=name)).encode(), headers={'Content-Type': 'application/json'}))
          def evo_push(name, event, data, token=None):
              if token is None:
                  token = evo()['instances'][name]['body']['webhook']['headers']['x-cgch-token']
              req = urllib.request.Request(BASE + '/channel/evolution/webhook', method='POST',
                  data=json.dumps({'event': event, 'instance': name, 'data': data, 'apikey': 'HASH-' + name}).encode(),
                  headers={'Content-Type': 'application/json', 'x-cgch-token': token})
              try:
                  return urllib.request.urlopen(req).status
              except urllib.error.HTTPError as e:
                  return e.code
          def evo_msg(name, mid, jid, message, mtype, from_me=False, push='Evo Buyer', **key):
              return evo_push(name, 'messages.upsert', {'key': dict({'remoteJid': jid, 'fromMe': from_me, 'id': mid}, **key), 'pushName': push,
                  'message': message, 'messageType': mtype, 'messageTimestamp': int(time.time()), 'instanceId': 'id-' + name, 'source': 'android'})
          def evo_upload(fields, filename, content, ctype):
              b = '----cgchevo'
              parts = b''.join(f'--{b}\r\nContent-Disposition: form-data; name="{k}"\r\n\r\n{v}\r\n'.encode() for k, v in fields.items())
              parts += f'--{b}\r\nContent-Disposition: form-data; name="file"; filename="{filename}"\r\nContent-Type: {ctype}\r\n\r\n'.encode() + content + f'\r\n--{b}--\r\n'.encode()
              hdr = {k: v for k, v in H.items() if k != 'Content-Type'}
              hdr['Content-Type'] = f'multipart/form-data; boundary={b}'
              return json.load(urllib.request.urlopen(urllib.request.Request(BASE + '/channel/wa/message/send-media', method='POST', data=parts, headers=hdr)))
          call('PUT', '/channel/ai/config/save', dict(cfg_k, llmApiKey='', waMode='off'))
          assert call('GET', '/channel/evolution/config') == {'enabled': True}
          # 配对码
