          call('PUT', '/channel/ai/config/save', dict(cfg_k, llmApiKey=''))
          print('WhatsApp 扫码接入：配对码、二维码、手机确认建账号、收发消息、已读回执、手机端回显、群消息忽略、媒体收发、主动发起、掉线重扫、放弃连接、删除')
          # ---- YouTube / TikTok 视频评论：授权绑定 → 拉取评论进会话（首次只导入历史）→ 回复评论 ----
          def mock_post(path, body):
              urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:18080' + path, data=json.dumps(body).encode(), method='POST',
                                                            headers={'Content-Type': 'application/json'}))
          def oauth_state(u):
              return urllib.parse.parse_qs(urllib.parse.urlparse(u).query)['state'][0]
          assert call('GET', '/channel/social/platforms') == ['youtube', 'tiktok']
          call('PUT', '/channel/ai/config/save', dict(cfg_k, llmApiKey='', waMode='off'))
          yu = call('GET', '/channel/social/youtube/authorize-url')
