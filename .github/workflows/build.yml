          def mpush(obj, entry_id, events, secret='metasec'):
              payload = json.dumps({'object': obj, 'entry': [{'id': entry_id, 'time': int(time.time() * 1000), 'messaging': events}]}).encode()
              sig = 'sha256=' + hmac.new(secret.encode(), payload, hashlib.sha256).hexdigest()
              return mraw('POST', MHOOK, payload, {'Content-Type': 'application/json', 'X-Hub-Signature-256': sig})[0]
