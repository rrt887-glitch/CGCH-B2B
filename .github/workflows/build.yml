          def oauth_bind(provider, code='good-code', error=None):
              url = call('GET', f'/channel/oauth/{provider}/authorize-url')
              q = urllib.parse.parse_qs(urllib.parse.urlparse(url).query)
              assert q['redirect_uri'][0] == f'http://127.0.0.1:48080/admin-api/channel/oauth/{provider}/callback', q
