          page = urllib.request.urlopen(BASE + f'/channel/social/youtube/callback?code=bad&state={oauth_state(yu)}').read().decode()
          assert '授权失败' in page, page
          yu = call('GET', '/channel/social/youtube/authorize-url')
          page = urllib.request.urlopen(BASE + f'/channel/social/youtube/callback?code=yt-code&state={oauth_state(yu)}').read().decode()
          assert 'YouTube 授权成功' in page and 'CGCH Channel' in page, page
          yt = next(a for a in call('GET', '/channel/wa-account/list') if a.get('platform') == 'youtube')
          assert yt['displayPhone'] == 'CGCH Channel' and yt['phoneNumberId'] == 'UCCGCH' and yt['enabled'], yt
          def yth(tid, author, text):
              return {'id': tid, 'snippet': {'videoId': 'vid1', 'topLevelComment': {'id': tid, 'snippet': {
                  'authorChannelId': {'value': 'UC' + author}, 'authorDisplayName': author, 'textOriginal': text,
                  'publishedAt': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())}}}}
          mock_post('/_yt/add', yth('th0', 'OldFan', 'Nice video'))
          assert call('POST', f"/channel/social/poll?id={yt['id']}") == 0, '首次只导入历史评论'
          mock_post('/_yt/add', yth('th1', 'BuyerBob', 'Do you sell wholesale? I need 500 units'))
          assert call('POST', f"/channel/social/poll?id={yt['id']}") == 1
          assert call('POST', f"/channel/social/poll?id={yt['id']}") == 0, '已入库的评论不重复'
          convs = {c['waId']: c for c in call('GET', '/channel/wa/conversation/page?pageNo=1&pageSize=100')['list'] if c['platform'] == 'youtube'}
          assert set(convs) == {'th0', 'th1'} and convs['th1']['profileName'] == 'BuyerBob' and convs['th0']['unreadCount'] == 0, convs
          tm = call('GET', f"/channel/wa/message/list?conversationId={convs['th1']['id']}")
          assert tm[0]['direction'] == 1 and tm[0]['textBody'] == '（评论视频《Hair dryer demo》）Do you sell wholesale? I need 500 units', tm
          call('POST', '/channel/wa/message/send', {'conversationId': convs['th1']['id'], 'text': 'Yes! Please email sales@cgch.test'})
          assert json.load(urllib.request.urlopen('http://127.0.0.1:18080/_social'))['yt'][-1] == {'parentId': 'th1', 'textOriginal': 'Yes! Please email sales@cgch.test'}
          assert call('POST', f"/channel/social/poll?id={yt['id']}") == 0
          assert len(call('GET', f"/channel/wa/message/list?conversationId={convs['th1']['id']}")) == 2, '自己的回复不重复入库'
          tu = call('GET', '/channel/social/tiktok/authorize-url?hint=@cgch_shop')
          assert tu.startswith('http://127.0.0.1:18080/tt/auth?client_key=ttid&state=') and tu.endswith('&disable_auto_auth=1'), tu
          page = urllib.request.urlopen(BASE + f'/channel/social/tiktok/callback/?auth_code=tt-code&state={oauth_state(tu)}').read().decode()
          assert 'TikTok 授权成功' in page and '@cgch_shop' in page, page
          tt = next(a for a in call('GET', '/channel/wa-account/list') if a.get('platform') == 'tiktok')
          assert tt['displayPhone'] == '@cgch_shop' and tt['phoneNumberId'] == 'OPEN1', tt
          def ttc(cid, author, text):
              return {'comment_id': cid, 'video_id': 'TV1', 'text': text, 'display_name': author, 'username': author.lower(),
                      'unique_identifier': 'U' + cid, 'owner': False, 'create_time': str(int(time.time()))}
          mock_post('/_tt/add', ttc('TC1', 'Old', 'cool'))
          assert call('POST', f"/channel/social/poll?id={tt['id']}") == 0
          mock_post('/_tt/add', ttc('TC2', 'Tina', 'How much for 200 pcs?'))
          assert call('POST', f"/channel/social/poll?id={tt['id']}") == 1
          tc = next(c for c in call('GET', '/channel/wa/conversation/page?pageNo=1&pageSize=100')['list'] if c['waId'] == 'TV1:TC2')
          assert tc['platform'] == 'tiktok' and tc['profileName'] == 'Tina' and tc['windowOpen'], tc
          call('POST', '/channel/wa/message/send', {'conversationId': tc['id'], 'text': 'Hi Tina, around $8 per piece.'})
          assert json.load(urllib.request.urlopen('http://127.0.0.1:18080/_social'))['tt'][-1] == {
              'business_id': 'OPEN1', 'video_id': 'TV1', 'comment_id': 'TC2', 'text': 'Hi Tina, around $8 per piece.'}
          assert call('POST', f"/channel/social/poll?id={tt['id']}") == 0
          for a in (yt, tt):
              call('DELETE', f"/channel/wa-account/delete?id={a['id']}")
          call('PUT', '/channel/ai/config/save', dict(cfg_k, llmApiKey=''))
          print('YouTube / TikTok 评论：授权绑定、首次导入历史、新评论进会话、回复评论、不重复入库')
          call('PUT', '/channel/wa-account/update', dict(sa, enabled=False))
          assert pub('GET', '/config?k=' + K)['code'] != 0, '停用后聊天窗口不再显示'
          call('DELETE', f'/channel/wa-account/delete?id={site}')
          call('PUT', '/channel/ai/config/save', dict(cfg_r, llmApiKey=''))
          print('官网 IM：绑定域名、校验来源、访客发消息进会话、建档来源为官网IM、业务员回复访客可见、停用后不可用')
          PY

      - name: 后端日志
        if: always()
        run: tail -300 server.log || true

      - name: 失败时把日志摘要写成注解
        if: failure()
        run: |
          emit() {  # $1 标题  $2 文件  —— 每段 40 行写成一条注解
            [ -f "$2" ] || return 0
            grep -nE 'ERROR|Exception|Caused by|FAIL|BUILD' "$2" | tail -120 > snippet.txt || true
            [ -s snippet.txt ] || tail -120 "$2" > snippet.txt
            split -l 40 snippet.txt part_
            for f in part_*; do
              msg=$(sed 's/%/%25/g' "$f" | cut -c1-300 | awk '{printf "%s%%0A", $0}')
              echo "::error title=$1 ($f)::$msg"
            done
            rm -f part_* snippet.txt
          }
          emit build.log build.log
          if [ -f server.log ]; then
            sed 's/\x1b\[[0-9;]*m//g' server.log > clean.log
            { grep -n -A30 'APPLICATION FAILED TO START' clean.log; grep -n 'Caused by' clean.log | tail -15; \
              grep -n -A12 ' ERROR ' clean.log | grep -v '^\s*$' | tail -60; } \
              | cut -c1-900 > why.txt || true
            split -l 25 why.txt why_
            for f in why_*; do
              msg=$(sed 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
              echo "::error title=startup ($f)::$msg"
            done
          fi

  frontend:
    name: 前端类型检查 + 打包
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 启用 pnpm
        run: |
          npm i -g corepack@latest
          corepack enable
          pnpm -v

      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile

      - name: 类型检查（有任何类型错误则失败）
        run: |
          # setup-node 自带的 tsc 问题匹配器每步最多 10 条注解，先关掉，下面自己合并成注解
          echo "::remove-matcher owner=tsc::"
          pnpm -F @vben/web-antd run typecheck > typecheck.log 2>&1 || true
          sed -i 's/\x1b\[[0-9;]*m//g' typecheck.log
          grep -E "error TS" typecheck.log > ts-errors.log || true
          n=$(wc -l < ts-errors.log)
          echo "类型错误：$n 个"
          cat ts-errors.log
          sed -E 's/^src\///; s/error TS[0-9]+: //' ts-errors.log | cut -c1-260 | split -l 12 - ts-part-
          for f in $(ls ts-part-* 2>/dev/null | head -10); do
            echo "::error title=类型错误（共 $n 个）::$(sed 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')"
          done
          [ "$n" -eq 0 ]

      - name: 单元测试
        if: ${{ !cancelled() }}
        run: |
          code=0
          pnpm exec vitest run --dom --reporter=default --reporter=json --outputFile=../vitest.json > ../vitest.log 2>&1 || code=$?
          tail -30 ../vitest.log
          node -e '
            const r = JSON.parse(require("fs").readFileSync("../vitest.json", "utf8"));
            console.log(`::notice title=单元测试::共 ${r.numTotalTests} 个，通过 ${r.numPassedTests} 个，失败 ${r.numFailedTests} 个`);
            for (const f of r.testResults) for (const t of f.assertionResults) if (t.status === "failed") {
              const msg = (t.failureMessages || []).join(" ").replace(/\x1b\[[0-9;]*m/g, "").slice(0, 900);
              const file = f.name.replace(/.*\/frontend\//, "");
              console.log(`::error title=单元测试失败 ${file}::${t.fullName} — ${msg}`.replace(/%/g, "%25").replace(/\n/g, "%0A"));
            }
          ' || true
          exit $code

      - name: 打包（web-antd）
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          # 生产部署：前端与后端同域，接口走相对路径 /admin-api（见 deploy/Caddyfile）；vben 只从 .env 文件读取配置
          printf 'VITE_BASE_URL=\nVITE_GLOB_API_URL=/admin-api\n' > apps/web-antd/.env.production.local
          pnpm build:antd 2>&1 | tee ../fe-build.log; code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            msg=$(grep -nE 'error|Error|ERR' ../fe-build.log | tail -40 | sed 's/%/%25/g' | cut -c1-300 | awk '{printf "%s%%0A", $0}')
            echo "::error title=frontend build::$msg"
          fi
          exit $code

      - name: 首次打开要下载的文件
        run: |
          node scripts/first-load-report.mjs apps/web-antd/dist | tee ../first-load.txt
          while IFS= read -r line; do echo "::notice title=首次打开::$line"; done < ../first-load.txt

      - name: 打包结果能在浏览器里正常打开（登录页）
        run: |
          (cd apps/web-antd/dist && python3 -m http.server 4173 >/dev/null 2>&1 &)
          sleep 2
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          timeout 120 "$chrome" --headless=new --no-sandbox --disable-gpu --enable-logging=stderr --v=0 \
            --virtual-time-budget=20000 --dump-dom "http://127.0.0.1:4173/#/auth/login" > ../login-dom.html 2> ../login-console.log || true
          # 没有后端，接口请求失败是正常的；只检查脚本本身的错误（例如打包后模块初始化顺序不对）
          grep -E 'Uncaught|TypeError|ReferenceError|SyntaxError|before initialization' ../login-console.log | grep -vE 'AxiosError|Request failed|status code|admin-api|Network Error|ERR_|DOCTYPE' | head -20 > ../login-errors.txt || true
          if [ -s ../login-errors.txt ]; then
            echo "::error title=登录页脚本报错::$(sed 's/%/%25/g' ../login-errors.txt | cut -c1-300 | awk '{printf "%s%%0A", $0}')"; exit 1
          fi
          grep -q 'type="password"' ../login-dom.html || {
            echo "::error title=登录页没有渲染出来::$(grep -iE 'console|error' ../login-console.log | tail -15 | sed 's/%/%25/g' | cut -c1-300 | awk '{printf "%s%%0A", $0}')"; exit 1; }
          echo "::notice title=登录页::正常渲染"

      - uses: actions/upload-artifact@v4
        with:
          name: web-antd-dist
          path: frontend/apps/web-antd/dist*
          if-no-files-found: warn

  evolution:
    name: Evolution API 实机兼容性检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 启动 Evolution API（与一键安装相同的镜像和配置）
        run: |
          set -e
          IMG=$(grep -o 'EVOLUTION_IMAGE:-[^}]*' deploy/install.sh | cut -d- -f2-)
          echo "镜像：$IMG"
          docker run -d --name evo-db --network host -e POSTGRES_DB=evolution -e POSTGRES_USER=evolution -e POSTGRES_PASSWORD=pw postgres:16-alpine
          for i in $(seq 1 30); do docker exec evo-db pg_isready -U evolution -d evolution >/dev/null 2>&1 && break; sleep 2; done
          docker run -d --name evo --network host \
            -e SERVER_TYPE=http -e SERVER_PORT=8080 -e SERVER_URL=http://127.0.0.1:8080 -e SERVER_DISABLE_MANAGER=true -e SERVER_DISABLE_DOCS=true \
            -e AUTHENTICATION_API_KEY=evo-key -e DATABASE_PROVIDER=postgresql \
            -e 'DATABASE_CONNECTION_URI=postgresql://evolution:pw@127.0.0.1:5432/evolution?schema=public' -e DATABASE_CONNECTION_CLIENT_NAME=cgch \
            -e DATABASE_SAVE_DATA_INSTANCE=true -e DATABASE_SAVE_DATA_NEW_MESSAGE=true -e CACHE_REDIS_ENABLED=false -e CACHE_LOCAL_ENABLED=true \
            -e LOG_LEVEL=ERROR,WARN,INFO -e DEL_INSTANCE=false -e LANGUAGE=en -e CONFIG_SESSION_PHONE_CLIENT=CGCH -e TELEMETRY_ENABLED=false \
            -e WEBSOCKET_ENABLED=false -e RABBITMQ_ENABLED=false -e WEBHOOK_GLOBAL_ENABLED=false "$IMG"
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1 && break; sleep 3; done
          curl -fsS http://127.0.0.1:8080/ && echo || { echo "::error title=evolution start::$(docker logs --tail 40 evo 2>&1 | cut -c1-220 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; exit 1; }
      - name: 按系统的请求格式调用（建实例、二维码、配对码、状态、推送、删除）
        run: |
          python3 - <<'PY'
          import sys, traceback
          sys.excepthook = lambda t, v, tb: (print('::error title=evolution::' + ''.join(traceback.format_exception(t, v, tb)).replace('%', '%25').replace('\n', '%0A')[-3000:]), sys.__excepthook__(t, v, tb))
          import json, threading, time, urllib.request, urllib.error
          from http.server import BaseHTTPRequestHandler, HTTPServer
          GOT = []
          class H(BaseHTTPRequestHandler):
              def do_POST(self):
                  body = self.rfile.read(int(self.headers.get('Content-Length') or 0))
                  GOT.append((self.headers.get('x-cgch-token'), json.loads(body or b'{}')))
                  self.send_response(200); self.end_headers(); self.wfile.write(b'ok')
              def log_message(self, *a):
                  pass
          threading.Thread(target=HTTPServer(('127.0.0.1', 18999), H).serve_forever, daemon=True).start()
          B = 'http://127.0.0.1:8080'
          def call(m, p, body=None):
              req = urllib.request.Request(B + p, method=m, headers={'apikey': 'evo-key', 'Content-Type': 'application/json'},
                                           data=json.dumps(body).encode() if body is not None else None)
              try:
                  return json.load(urllib.request.urlopen(req, timeout=90))
              except urllib.error.HTTPError as e:
                  return {'_status': e.code, **json.loads(e.read() or b'{}')}
          def create(name, number=None):
              b = {'instanceName': name, 'integration': 'WHATSAPP-BAILEYS', 'qrcode': True, 'groupsIgnore': True, 'rejectCall': False,
                   'alwaysOnline': False, 'readMessages': False, 'readStatus': False, 'syncFullHistory': False,
                   'webhook': {'enabled': True, 'url': 'http://127.0.0.1:18999/hook', 'byEvents': False, 'base64': False,
                               'headers': {'x-cgch-token': 'tok-' + name}, 'events': ['CONNECTION_UPDATE', 'MESSAGES_UPSERT', 'MESSAGES_UPDATE', 'MESSAGES_SET']}}
              if number:
                  b['number'] = number
              return call('POST', '/instance/create', b)
          r = create('cgch-1-1-ci')
          print(json.dumps({k: v for k, v in r.items() if k != 'qrcode'}, ensure_ascii=False)[:600])
          assert r.get('hash') and r['instance']['instanceName'] == 'cgch-1-1-ci', r
          qr = (r.get('qrcode') or {}).get('base64') or ''
          for i in range(10):
              if qr:
                  break
              time.sleep(3)
              qr = call('GET', '/instance/connect/cgch-1-1-ci').get('base64') or ''
          assert qr.startswith('data:image/png;base64,'), '没有拿到二维码（Evolution 连不上 WhatsApp 服务器？）'
          st = call('GET', '/instance/connectionState/cgch-1-1-ci')
          assert st['instance']['state'] in ('connecting', 'close'), st
          fi = call('GET', '/instance/fetchInstances?instanceName=cgch-1-1-ci')
          assert isinstance(fi, list) and fi[0]['name'] == 'cgch-1-1-ci' and 'ownerJid' in fi[0] and 'connectionStatus' in fi[0], fi
          for i in range(20):
              if any(t == 'tok-cgch-1-1-ci' and e.get('event') == 'connection.update' and e.get('instance') == 'cgch-1-1-ci' and 'state' in e.get('data', {}) for t, e in GOT):
                  break
              time.sleep(1)
          assert any(t == 'tok-cgch-1-1-ci' and e.get('event') == 'connection.update' for t, e in GOT), GOT[:3]
          print('推送格式：', json.dumps(GOT[0][1], ensure_ascii=False)[:300])
          missing = call('GET', '/instance/connectionState/cgch-not-exist')
          print('实例不存在：', missing)
          msg = json.dumps(missing)
          assert 'does not exist' in msg or 'not found' in msg.lower(), missing
          r2 = create('cgch-1-1-ci2', '8613800002222')
          pc = (r2.get('qrcode') or {}).get('pairingCode') or call('GET', '/instance/connect/cgch-1-1-ci2').get('pairingCode')
          print('配对码：', pc)
          if not pc:
              print('::warning::测试号码没有拿到配对码（WhatsApp 可能拒绝了虚构号码），请用真实号码验证')
          for n in ('cgch-1-1-ci', 'cgch-1-1-ci2'):
              d = call('DELETE', f'/instance/delete/{n}')
              print('删除', n, d)
              assert d.get('status') == 'SUCCESS' or 'does not exist' in json.dumps(d), d
          for i in range(10):
              if 'does not exist' in json.dumps(call('GET', '/instance/connectionState/cgch-1-1-ci')):
                  break
              time.sleep(1)
          assert 'does not exist' in json.dumps(call('GET', '/instance/connectionState/cgch-1-1-ci')), '删除后实例应不存在'
          print('Evolution API 实机检查通过：建实例、二维码、状态、实例信息、推送格式与校验头、删除')
          PY
      - name: Evolution 日志
        if: always()
        run: |
          docker logs --tail 120 evo 2>&1 || true
          echo "::warning title=evolution log::$(docker logs --tail 40 evo 2>&1 | cut -c1-220 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"

  release:
    name: 发布镜像并验证一键安装（main）
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/rrt887-glitch
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: yudao-server-jar
          path: ctx/backend

      - uses: actions/download-artifact@v4
        with:
          name: web-antd-dist
          path: ctx/web-artifact

      - name: 准备镜像内容
        run: |
          set -e
          cp deploy/docker/backend.Dockerfile ctx/backend/Dockerfile
          mkdir -p ctx/web ctx/mysql/sql
          cp -r ctx/web-artifact/dist ctx/web/dist
          test -f ctx/web/dist/index.html
          grep -q '"/admin-api"' ctx/web/dist/_app-config*.js || { echo "::error::前端接口地址不是 /admin-api"; cat ctx/web/dist/_app-config*.js; exit 1; }
          ! grep -rq '127.0.0.1:48080' ctx/web/dist --include=*.js || { echo "::error::前端里还有 127.0.0.1:48080"; exit 1; }
          cp deploy/Caddyfile ctx/web/Caddyfile
          cp deploy/docker/web.Dockerfile ctx/web/Dockerfile
          cp deploy/docker/mysql.Dockerfile ctx/mysql/Dockerfile
          cp deploy/docker/cgch-migrate.sh ctx/mysql/cgch-migrate.sh
          mkdir -p ctx/mysql/migrations
          cp backend/sql/mysql/cgch/migrations/*.sql ctx/mysql/migrations/ 2>/dev/null || true
          i=10
          for f in backend/sql/mysql/ruoyi-vue-pro.sql backend/sql/mysql/quartz.sql \
                   backend/sql/mysql/cgch/00-bpm-schema.sql backend/sql/mysql/cgch/00-crm-schema.sql \
                   backend/sql/mysql/cgch/00-pay-schema.sql backend/sql/mysql/cgch/00-ai-schema.sql \
                   backend/sql/mysql/cgch/00-channel-schema.sql backend/sql/mysql/cgch/01-menu.sql \
                   backend/sql/mysql/cgch/02-crm-seed.sql backend/sql/mysql/cgch/03-channel-seed.sql backend/sql/mysql/cgch/04-indexes.sql; do
            cp "$f" "ctx/mysql/sql/${i}-$(basename "$f")"; i=$((i+1))
          done
          # 新装数据库已是最新结构：把现有升级脚本标记为已执行
          {
            echo "CREATE TABLE IF NOT EXISTS cgch_migration (name varchar(100) NOT NULL PRIMARY KEY, applied_at datetime NOT NULL DEFAULT CURRENT_TIMESTAMP);"
            for f in ctx/mysql/migrations/*.sql; do [ -f "$f" ] && echo "INSERT IGNORE INTO cgch_migration (name) VALUES ('$(basename "$f")');"; done
          } > ctx/mysql/sql/99-migrations-baseline.sql
          ls -R ctx/mysql ctx/backend

      - name: 登录 GitHub 镜像仓库
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: 构建并推送镜像
        run: |
          set -e
          for n in backend web mysql; do
            docker build -t $REGISTRY/cgch-$n:latest -t $REGISTRY/cgch-$n:${{ github.sha }} \
              --label org.opencontainers.image.source=https://github.com/${{ github.repository }} ctx/$n
            docker push $REGISTRY/cgch-$n:${{ github.sha }}
            docker push $REGISTRY/cgch-$n:latest
          done

      - name: 在全新环境执行一键安装脚本
        run: |
          set -e
          fail() { msg="失败的命令：$BASH_COMMAND%0A$(tail -n 40 /tmp/install*.log 2>/dev/null | sed 's/%/%25/g' | cut -c1-200 | awk '{printf "%s%%0A", $0}')"; echo "::error title=一键安装::$msg"; }
          trap fail ERR
          docker image rm -f $REGISTRY/cgch-backend:${{ github.sha }} $REGISTRY/cgch-web:${{ github.sha }} $REGISTRY/cgch-mysql:${{ github.sha }} >/dev/null 2>&1 || true
          cat deploy/install.sh | sudo CGCH_VERSION=${{ github.sha }} GHCR_TOKEN="${{ secrets.GITHUB_TOKEN }}" GHCR_USER="${{ github.actor }}" bash 2>&1 | tee /tmp/install.log  # 与用户一样用管道执行
          grep -q '安装完成' /tmp/install.log || { echo "::error::安装脚本没有执行到最后"; exit 1; }
          curl -fsS http://127.0.0.1/privacy | grep -q 'Privacy Policy'
          curl -fsS http://127.0.0.1/ | grep -qi '<div id="app"'
          code=$(curl -s -o /tmp/login.json -w '%{http_code}' -H 'tenant-id: 1' -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"wrong-password"}' http://127.0.0.1/admin-api/system/auth/login)
          cat /tmp/login.json; echo
          test "$code" = 200 && grep -q '"code"' /tmp/login.json
          sudo grep -q '^CGCH_FIELD_ENCRYPT_KEY=' /opt/cgch/.env
          sudo grep -q '^CGCH_EVOLUTION_API_KEY=.\+' /opt/cgch/.env && sudo grep -q '^EVOLUTION_DB_PASSWORD=.\+' /opt/cgch/.env
          ok=; for i in $(seq 1 40); do sudo bash -c 'cd /opt/cgch && docker compose exec -T web wget -q -O - http://evolution:8080/' </dev/null 2>/dev/null | grep -qi 'evolution' && { ok=1; break; }; sleep 3; done
          [ -n "$ok" ] || { echo "::error::Evolution API 没有启动"; sudo bash -c 'cd /opt/cgch && docker compose logs --tail 80 evolution'; exit 1; }
          js=$(curl -fsS http://127.0.0.1/ | grep -o '/jse/[^"]*\.js' | head -1); echo "入口脚本：$js"
          curl -fsS -o /dev/null -D /tmp/h.txt -H 'Accept-Encoding: br, gzip' "http://127.0.0.1$js"; cat /tmp/h.txt
          grep -qi '^cache-control: public, max-age=31536000, immutable' /tmp/h.txt || { echo "::error::打包文件没有长期缓存头"; exit 1; }
          grep -qi '^content-encoding: br' /tmp/h.txt || { echo "::error::打包文件没有使用 brotli 压缩"; exit 1; }
          curl -fsS -o /dev/null -D /tmp/h2.txt http://127.0.0.1/; grep -qi '^cache-control: no-cache' /tmp/h2.txt || { echo "::error::index.html 不应长期缓存"; cat /tmp/h2.txt; exit 1; }
          for h in 'x-content-type-options: nosniff' 'x-frame-options: sameorigin' 'referrer-policy: strict-origin-when-cross-origin' 'x-request-id: '; do
            grep -qi "^$h" /tmp/h2.txt || { echo "::error::缺少安全响应头 $h"; cat /tmp/h2.txt; exit 1; }
          done
          ! grep -qi '^server:' /tmp/h2.txt || { echo "::error::不应返回 Server 头"; exit 1; }
          curl -fsS -o /dev/null -D /tmp/h3.txt -H 'tenant-id: 1' http://127.0.0.1/admin-api/system/tenant/get-id-by-name?name=x || true
          grep -qi '^x-content-type-options: nosniff' /tmp/h3.txt || { echo "::error::接口响应缺少安全响应头"; cat /tmp/h3.txt; exit 1; }
          sudo bash -c 'cd /opt/cgch && docker compose exec -T mysql sh -c "mysql -uroot -p\$MYSQL_ROOT_PASSWORD -N ruoyi-vue-pro -e \"SELECT config FROM infra_file_config WHERE id=4\""' | grep -q '"domain": *"http://'
          echo "--- 模拟老数据库：删掉 v3 新增字段并清除升级记录，验证升级脚本 ---"
          sudo bash -c 'cd /opt/cgch && docker compose exec -T mysql sh -c "mysql -uroot -p\$MYSQL_ROOT_PASSWORD ruoyi-vue-pro -e \"ALTER TABLE channel_wa_conversation DROP COLUMN intent; ALTER TABLE channel_mail_message DROP COLUMN intent; ALTER TABLE channel_wa_message DROP INDEX idx_account_wamid; DELETE FROM cgch_migration WHERE name IN (\\\"001-v3-brand-intent.sql\\\", \\\"016-indexes.sql\\\");\""'
          echo "--- 再执行一次（升级场景）---"
          set -o pipefail
          cat deploy/install.sh | sudo CGCH_VERSION=${{ github.sha }} GHCR_TOKEN="${{ secrets.GITHUB_TOKEN }}" GHCR_USER="${{ github.actor }}" bash 2>&1 | tee /tmp/install2.log \
            || { echo "::error title=升级安装失败::$(grep -E '执行数据库升级|ERROR|错误' /tmp/install2.log | tail -15 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; exit 1; }
          curl -fsS http://127.0.0.1/terms | grep -q 'Terms of Service'
          grep -q '执行数据库升级：001-v3-brand-intent.sql' /tmp/install2.log || { echo "::error::升级脚本没有执行"; exit 1; }
          # 升级脚本补的索引：去重查询要走索引
          dbq() { sudo bash -c 'cd /opt/cgch && docker compose exec -T mysql sh -c "mysql -uroot -p\$MYSQL_ROOT_PASSWORD -N ruoyi-vue-pro"' 2>/dev/null; }
          idx=$(echo "SELECT COUNT(DISTINCT TABLE_NAME, INDEX_NAME) FROM information_schema.STATISTICS WHERE TABLE_SCHEMA = DATABASE() AND (TABLE_NAME LIKE 'channel\\_%' OR TABLE_NAME LIKE 'crm\\_%') AND INDEX_NAME LIKE 'idx%';" | dbq | tail -1)
          echo "索引数：$idx"
          grep -oE "^CALL cgch_add_index\('[a-z_]+', '[a-z_]+'" backend/sql/mysql/cgch/04-indexes.sql | sed -E "s/.*\('([a-z_]+)', '([a-z_]+)'/\1 \2/" | sort > /tmp/idx-want.txt
          echo "SELECT DISTINCT CONCAT(TABLE_NAME, ' ', INDEX_NAME) FROM information_schema.STATISTICS WHERE TABLE_SCHEMA = DATABASE() AND INDEX_NAME LIKE 'idx%';" | dbq | sort > /tmp/idx-have.txt
          missing=$(comm -23 /tmp/idx-want.txt /tmp/idx-have.txt | tr '\n' ' ')
          [ -z "$missing" ] || { echo "::error::数据库索引没有建好，缺少：$missing。升级日志：$(grep -E '执行数据库升级|ERROR|错误' /tmp/install2.log | tail -15 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; exit 1; }
          echo "EXPLAIN SELECT id FROM channel_wa_message WHERE account_id = 1 AND wa_message_id = 'x';" | dbq | tee /tmp/explain.txt
          grep -q 'idx_account_wamid' /tmp/explain.txt || { echo "::error::消息查重没有使用索引"; exit 1; }
          sudo bash -c 'cd /opt/cgch && docker compose exec -T mysql sh -c "mysql -uroot -p\$MYSQL_ROOT_PASSWORD --default-character-set=utf8mb4 -N ruoyi-vue-pro -e \"SELECT name FROM system_tenant WHERE id = 1\""' | grep -q '草根出海'

      - name: 安装失败时的日志
        if: failure()
        run: sudo bash -c 'cd /opt/cgch && docker compose ps && docker compose logs --tail 200' || true
