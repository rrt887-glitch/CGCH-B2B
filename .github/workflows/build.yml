          print('æŽ¨é€æ ¼å¼ï¼š', json.dumps(GOT[0][1], ensure_ascii=False)[:300])
          # å®žä¾‹è®¾ç½®ï¼šè¯»å‡ºåŽåªæ”¹ groupsIgnore å†æ•´ä½“å†™å›žï¼ˆå·²æœ‰å®žä¾‹æ”¹ä¸ºæŽ¥æ”¶ç¾¤èŠï¼‰
