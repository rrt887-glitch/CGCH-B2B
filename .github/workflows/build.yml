name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端编译 + 启动冒烟测试
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: '123456'
          MYSQL_DATABASE: ruoyi-vue-pro
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -p123456"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7
        ports: ['6379:6379']
      greenmail:  # 测试用邮件服务器：SMTP 3025、IMAP 3143，任意账号密码均可登录
        image: greenmail/standalone:2.1.3
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
            -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
        ports: ['3025:3025', '3143:3143']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven 使用中央仓库（CI 环境访问国内镜像较慢）
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings><mirrors><mirror><id>central-all</id><mirrorOf>*</mirrorOf>
          <url>https://repo.maven.apache.org/maven2</url></mirror></mirrors></settings>
          EOF

      - name: 编译打包
        working-directory: backend
        run: mvn -B -ntp -T 2C -DskipTests -Dmaven.javadoc.skip=true clean install 2>&1 | tee ../build.log; exit ${PIPESTATUS[0]}

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: yudao-server-jar
          path: backend/yudao-server/target/yudao-server.jar
          retention-days: 7

      - name: 导入数据库
        run: |
          for f in backend/sql/mysql/ruoyi-vue-pro.sql backend/sql/mysql/quartz.sql backend/sql/mysql/cgch/00-bpm-schema.sql backend/sql/mysql/cgch/00-crm-schema.sql backend/sql/mysql/cgch/00-pay-schema.sql backend/sql/mysql/cgch/00-ai-schema.sql backend/sql/mysql/cgch/00-channel-schema.sql backend/sql/mysql/cgch/01-menu.sql backend/sql/mysql/cgch/02-crm-seed.sql backend/sql/mysql/cgch/03-channel-seed.sql backend/sql/mysql/cgch/04-indexes.sql; do
            echo "导入 $f"
            if ! mysql -h 127.0.0.1 -uroot -p123456 --default-character-set=utf8mb4 ruoyi-vue-pro < "$f" 2> sql_err.txt; then
              cat sql_err.txt
              echo "::error title=导入 SQL 失败 $(basename "$f")::$(sed 's/%/%25/g' sql_err.txt | awk '{printf "%s%%0A", $0}')"
              exit 1
            fi
          done
          mysql -h 127.0.0.1 -uroot -p123456 ruoyi-vue-pro -e \
            "SELECT id, name, sort FROM system_menu WHERE parent_id = 0 AND visible = b'1' ORDER BY sort;"
          # 索引脚本里的每个索引都要建好；再执行一次验证可重复执行
          mysql -h 127.0.0.1 -uroot -p123456 ruoyi-vue-pro < backend/sql/mysql/cgch/04-indexes.sql
          grep -oE "^CALL cgch_add_index\('[a-z_]+', '[a-z_]+'" backend/sql/mysql/cgch/04-indexes.sql | sed -E "s/.*\('([a-z_]+)', '([a-z_]+)'/\1 \2/" | sort > idx-want.txt
          mysql -h 127.0.0.1 -uroot -p123456 -N ruoyi-vue-pro -e "SELECT DISTINCT CONCAT(TABLE_NAME, ' ', INDEX_NAME) FROM information_schema.STATISTICS WHERE TABLE_SCHEMA = DATABASE() AND INDEX_NAME LIKE 'idx%';" | sort > idx-have.txt
          missing=$(comm -23 idx-want.txt idx-have.txt | tr '\n' ' ')
          [ -z "$missing" ] || { echo "::error title=索引没有建好::缺少：$missing"; exit 1; }
          echo "索引 $(wc -l < idx-want.txt) 个全部建好"

      - name: 生产配置安全检查
        run: |
          # 1. 仓库里不能再出现公开过的密钥
          if grep -rn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=target --exclude="*.class" --exclude="*.jar" --exclude=ProductionSecretsCheck.java --exclude=build.yml \
               -e 'WLWohCayruUlMUWn' -e 'Z579dnaRSE9uJ2vgpjnILyP0S6grC98z' -e 'qpizJVFuBjkrWRIw1FrVlf6aECC2trdh' . ; then
            echo "::error title=发现明文密钥::仓库中仍有公开过的密钥，请改为环境变量"; exit 1
          fi
          JAR=$(ls backend/yudao-server/target/yudao-server*.jar | grep -v original | head -1)
          # 2. prod 配置缺少密钥时必须拒绝启动
          set +e
          out=$(timeout 90 env -u CGCH_FIELD_ENCRYPT_KEY java -jar "$JAR" --spring.profiles.active=prod 2>&1); code=$?
          echo "$out" | grep -q '生产环境安全检查未通过' && [ $code -ne 0 ] && [ $code -ne 124 ] \
            || { echo "$out" | tail -40; echo "::error title=prod 安全检查::缺少密钥时没有拒绝启动（code=$code）%0A$(echo "$out" | grep -v '^\s*at ' | tail -15 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; exit 1; }
          echo "$out" | grep -q 'CGCH_FIELD_ENCRYPT_KEY' && echo "$out" | grep -q 'DB_PASSWORD' || { echo "::error::提示信息不完整"; exit 1; }
          # 3. 密钥长度不对（AES 只接受 16/24/32 位）也必须拒绝
          out=$(timeout 90 env CGCH_FIELD_ENCRYPT_KEY=abcdefghijklmnopqrstu DB_URL=jdbc:mysql://x/y DB_PASSWORD=Str0ng-Passw0rd \
                java -jar "$JAR" --spring.profiles.active=prod 2>&1); code=$?
          echo "$out" | grep -q '必须正好是 16、24 或 32' && [ $code -ne 0 ] || { echo "$out" | tail -40; echo "::error title=prod 安全检查::密钥长度不对没有被拒绝"; exit 1; }
          # 4. 使用公开过的旧密钥、弱数据库密码也必须拒绝
          out=$(timeout 90 env CGCH_FIELD_ENCRYPT_KEY=WLWohCayruUlMUWn DB_URL=jdbc:mysql://x/y DB_PASSWORD=123456 \
                java -jar "$JAR" --spring.profiles.active=prod 2>&1); code=$?
          echo "$out" | grep -q '公开过的值' && echo "$out" | grep -q '过于简单' && [ $code -ne 0 ] \
            || { echo "$out" | tail -40; echo "::error title=prod 安全检查::旧密钥或弱密码没有被拒绝（code=$code）%0A$(echo "$out" | grep -v '^\s*at ' | tail -15 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; exit 1; }
          set -e
          echo "生产配置安全检查通过：无明文密钥；缺少密钥、旧密钥、弱密码均拒绝启动"

      - name: 启动 Meta Graph API 模拟服务
        run: |
          nohup python3 .github/ci/mock_graph_api.py 18080 > mock.log 2>&1 &
          sleep 1 && curl -s http://127.0.0.1:18080/_sent

      - name: 启动后端并检查接口
        run: |
          JAR=$(ls backend/yudao-server/target/yudao-server*.jar | grep -v original | head -1)
          nohup java -jar "$JAR" --spring.profiles.active=local --cgch.ai.whatsapp-debounce-ms=500 --cgch.ai.takeover-minute-seconds=2 --cgch.ai.deferred-interval-ms=1000 --cgch.reactivate.send-interval-ms=0 --cgch.research.allowed-private-hosts=127.0.0.1 --cgch.oauth.redirect-base=http://127.0.0.1:48080 --cgch.oauth.google.client-id=gid --cgch.oauth.google.client-secret=gsec --cgch.oauth.google.auth-url=http://127.0.0.1:18080/oauth/google/authorize --cgch.oauth.google.token-url=http://127.0.0.1:18080/oauth/google/token --cgch.oauth.google.userinfo-url=http://127.0.0.1:18080/oauth/google/userinfo --cgch.oauth.google.imap-host=127.0.0.1 --cgch.oauth.google.imap-port=3143 --cgch.oauth.google.imap-ssl=false --cgch.oauth.google.smtp-host=127.0.0.1 --cgch.oauth.google.smtp-port=3025 --cgch.oauth.google.smtp-ssl=false --cgch.oauth.microsoft.client-id=mid --cgch.oauth.microsoft.client-secret=msec --cgch.oauth.microsoft.auth-url=http://127.0.0.1:18080/oauth/microsoft/authorize --cgch.oauth.microsoft.token-url=http://127.0.0.1:18080/oauth/microsoft/token --cgch.oauth.microsoft.imap-host=127.0.0.1 --cgch.oauth.microsoft.imap-port=3143 --cgch.oauth.microsoft.imap-ssl=false --cgch.oauth.microsoft.smtp-host=127.0.0.1 --cgch.oauth.microsoft.smtp-port=3025 --cgch.oauth.meta.client-id=metaid --cgch.oauth.meta.client-secret=metasec --cgch.oauth.meta.verify-token=meta-verify --cgch.oauth.meta.wa-config-id=cfg123 --cgch.oauth.meta.dialog-url=http://127.0.0.1:18080/fb/dialog --cgch.oauth.meta.api-base=http://127.0.0.1:18080 --cgch.social.poll-ms=86400000 --cgch.oauth.evolution.base-url=http://127.0.0.1:18080/evo --cgch.oauth.evolution.api-key=evo-key --cgch.oauth.evolution.webhook-base=http://127.0.0.1:48080 --cgch.oauth.youtube.client-id=ytid --cgch.oauth.youtube.client-secret=ytsec --cgch.oauth.youtube.auth-url=http://127.0.0.1:18080/yt/auth --cgch.oauth.youtube.token-url=http://127.0.0.1:18080/yt/token --cgch.oauth.youtube.api-base=http://127.0.0.1:18080/yt/v3 --cgch.oauth.tiktok.client-id=ttid --cgch.oauth.tiktok.client-secret=ttsec --cgch.oauth.tiktok.auth-url=http://127.0.0.1:18080/tt/auth?client_key=ttid --cgch.oauth.tiktok.api-base=http://127.0.0.1:18080/tt/v1.3 --cgch.site.company-name=测试科技有限公司 '--cgch.site.company-name-en=CGCH Test Co., Ltd.' --cgch.site.contact-email=privacy@cgch.test --logging.level.cn.iocoder.yudao.module.channel.service.realtime=DEBUG --logging.level.cn.iocoder.yudao.framework.websocket=DEBUG > server.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -s -o /dev/null http://127.0.0.1:48080/admin-api/system/tenant/get-id-by-name?name=x; then
              echo "后端已启动（${i}×5 秒）"; break
            fi
            if ! pgrep -f yudao-server > /dev/null; then echo "进程已退出"; tail -200 server.log; exit 1; fi
            sleep 5
          done
          echo "--- 租户接口 ---"
          curl -s 'http://127.0.0.1:48080/admin-api/system/tenant/get-id-by-name?name=%E8%8A%8B%E9%81%93%E6%BA%90%E7%A0%81'; echo
          echo "--- 登录接口 ---"
          curl -s -X POST http://127.0.0.1:48080/admin-api/system/auth/login \
            -H 'Content-Type: application/json' -H 'tenant-id: 1' \
            -d '{"username":"admin","password":"admin123"}' | tee login.json; echo
          grep -q '"code":0' login.json || { echo "登录失败"; tail -200 server.log; exit 1; }
          TOKEN=$(python3 -c "import json;print(json.load(open('login.json'))['data']['accessToken'])")
          echo "--- 当前用户菜单（一级） ---"
          curl -s http://127.0.0.1:48080/admin-api/system/auth/get-permission-info \
            -H "Authorization: Bearer $TOKEN" -H 'tenant-id: 1' > perm.json
          python3 - <<'EOF'
          import json
          d = json.load(open('perm.json'))
          assert d.get('code') == 0, d
          names = [m['name'] for m in d['data']['menus']]
          print(names)
          for want in ['智能看板', '渠道消息', 'AI-CRM', 'CRM Claw', '数字员工管理', '配置中台']:
              assert want in names, f'缺少菜单 {want}'
          print('6 个一级模块菜单都在')
          EOF
          echo "--- 业务接口（验证表结构与代码一致） ---"
          fail=0
          for api in crm/customer/page crm/clue/page crm/contact/page crm/business/page crm/contract/page crm/receivable/page \
                     crm/product/page crm/follow-up-record/page?bizType=2\&bizId=1 crm/business-status/page \
                     pay/app/page pay/order/page ai/chat/conversation/my-list ai/model/page bpm/category/page bpm/form/page; do
            sep='?'; case "$api" in *\?*) sep='&';; esac
            r=$(curl -s "http://127.0.0.1:48080/admin-api/${api}${sep}pageNo=1&pageSize=10" -H "Authorization: Bearer $TOKEN" -H 'tenant-id: 1')
            code=$(echo "$r" | python3 -c "import sys,json;print(json.load(sys.stdin).get('code'))" 2>/dev/null || echo parse-error)
            echo "$code  $api"
            if [ "$code" != "0" ]; then echo "  -> ${r:0:300}"; echo "::error title=api $api::${r:0:500}"; fail=1; fi
          done
          [ $fail -eq 0 ] || { echo '有业务接口失败'; exit 1; }

          echo "--- 外贸 CRM 扩展：标签、分组、客户新字段、筛选、查重、商机阶段 ---"
          export TOKEN
          python3 - <<'PY'
          import sys, traceback
          sys.excepthook = lambda t, v, tb: (print('::error title=test failed::' + ''.join(traceback.format_exception(t, v, tb)).replace('%', '%25').replace('\n', '%0A')), sys.__excepthook__(t, v, tb))
          import json, os, urllib.request
          BASE = 'http://127.0.0.1:48080/admin-api'
          H = {'Authorization': 'Bearer ' + os.environ['TOKEN'], 'tenant-id': '1', 'Content-Type': 'application/json'}
          def call(method, path, body=None):
              req = urllib.request.Request(BASE + path, method=method, headers=H,
                                           data=json.dumps(body).encode() if body is not None else None)
              d = json.load(urllib.request.urlopen(req))
              if d.get('code') != 0:
                  print(f'::error title={method} {path}::{d}')
                  raise SystemExit(f'{method} {path} 失败: {d}')
              return d['data']
          tag = call('POST', '/crm/tag/create', {'name': '重点客户', 'color': '#1677ff'})
          sub = call('POST', '/crm/tag/create', {'name': '北美', 'parentId': tag})
          group = call('POST', '/crm/customer-group/create', {'name': '展会客户'})
          print('标签', [t['name'] for t in call('GET', '/crm/tag/list')], '分组', [g['name'] for g in call('GET', '/crm/customer-group/list')])
          cid = call('POST', '/crm/customer/create', {
              'name': 'Acme Buyer', 'ownerUserId': 1, 'companyName': 'Acme Trading LLC', 'countryCode': 'US',
              'website': 'https://acme-trading.example', 'whatsapp': '+14155550100', 'email': 'buyer@acme-trading.example',
              'groupId': group, 'tagIds': [tag, sub], 'aiHosted': True})
          c = call('GET', f'/crm/customer/get?id={cid}')
          for k, v in {'companyName': 'Acme Trading LLC', 'countryCode': 'US', 'whatsapp': '+14155550100',
                       'groupId': group, 'tagIds': [tag, sub], 'aiHosted': True}.items():
              assert c.get(k) == v, f'客户字段 {k}: {c.get(k)!r} != {v!r}'
          print('客户新字段读写正常')
          page = call('GET', '/crm/customer/page?pageNo=1&pageSize=10&countryCode=US&aiHosted=true')
          assert any(r['id'] == cid for r in page['list']), f'按国家/托管筛选未找到客户: {page}'
          page = call('GET', '/crm/customer/page?pageNo=1&pageSize=10&countryCode=DE')
          assert all(r['id'] != cid for r in page['list']), '按国家筛选未生效'
          print('列表筛选正常')
          lid = call('POST', '/crm/clue/create', {'name': 'Acme 询盘', 'ownerUserId': 1, 'whatsapp': '+14155550100', 'countryCode': 'US'})
          hits = call('GET', '/crm/dedup/search?keyword=4155550100')
          kinds = sorted((h['type'], h['id']) for h in hits)
          assert ('customer', cid) in kinds and ('clue', lid) in kinds, f'查重结果不完整: {hits}'
          assert 'whatsapp' in next(h for h in hits if h['type'] == 'customer')['matchedFields']
          print('查重正常', kinds)
          req = urllib.request.Request(BASE + f'/crm/tag/delete?id={tag}', method='DELETE', headers=H)
          d = json.load(urllib.request.urlopen(req))
          assert d.get('code') != 0 and '子标签' in d.get('msg', ''), f'有子标签时删除应失败: {d}'
          print('有子标签时禁止删除，正常')
          types = call('GET', '/crm/business-status/type-simple-list')
          assert any(t.get('name') == '外贸标准流程' for t in types), f'缺少外贸标准流程: {types}'
          tid = next(t['id'] for t in types if t.get('name') == '外贸标准流程')
          names = [x['name'] for x in call('GET', f'/crm/business-status/status-simple-list?typeId={tid}')]
          print('商机阶段', names)
          assert names == ['初步回复', '背调', '需求挖掘', '报价', '样品', '合同签订', '订单执行', '赢单'], names
          PY

          echo "--- 邮箱渠道：绑定、收信、关联客户、回复、对方收到 ---"
          python3 - <<'PY'
          import sys, traceback
          sys.excepthook = lambda t, v, tb: (print('::error title=test failed::' + ''.join(traceback.format_exception(t, v, tb)).replace('%', '%25').replace('\n', '%0A')), sys.__excepthook__(t, v, tb))
          import imaplib, json, os, smtplib, time, urllib.request
          from email.message import EmailMessage
          BASE = 'http://127.0.0.1:48080/admin-api'
          H = {'Authorization': 'Bearer ' + os.environ['TOKEN'], 'tenant-id': '1', 'Content-Type': 'application/json'}
          def call(method, path, body=None, ok=True):
              req = urllib.request.Request(BASE + path, method=method, headers=H,
                                           data=json.dumps(body).encode() if body is not None else None)
              d = json.load(urllib.request.urlopen(req))
              if ok and d.get('code') != 0:
                  print(f'::error title={method} {path}::{d}')
                  raise SystemExit(f'{method} {path} 失败: {d}')
              return d if not ok else d['data']
          # 请求编号回传；跨域不带凭据
          rq = urllib.request.Request(BASE + '/system/auth/get-permission-info', headers=dict(H, **{'X-Request-ID': 'ci-rid-123', 'Origin': 'https://evil.example'}))
          rs = urllib.request.urlopen(rq)
          assert rs.headers.get('X-Request-ID') is None, '网关带了编号时由网关回写，后端不重复写'
          assert rs.headers.get('Access-Control-Allow-Credentials') is None, '跨域不应允许带凭据'
          rs2 = urllib.request.urlopen(urllib.request.Request(BASE + '/system/auth/get-permission-info', headers=H))
          assert len(rs2.headers.get('X-Request-ID') or '') >= 16, '没有请求编号时自动生成'
          print('请求编号回传、跨域不带凭据')
          import struct, zlib
          def tiny_png(tag):  # 1x1 像素的真实 PNG，末尾附带标记便于校验
              chunk = lambda t, d: struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
              return (b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', 1, 1, 8, 2, 0, 0, 0))
                      + chunk(b'IDAT', zlib.compress(b'\x00\xff\x00\x00')) + chunk(b'tEXt', b'tag\x00' + tag.encode())
                      + chunk(b'IEND', b''))
          account = {'provider': 'custom', 'email': 'sales@cgch.test', 'displayName': 'CGCH Sales',
                     'imapHost': '127.0.0.1', 'imapPort': 3143, 'imapSsl': False,
                     'smtpHost': '127.0.0.1', 'smtpPort': 3025, 'smtpSsl': False, 'password': 'pw'}
          call('POST', '/channel/mail-account/test', account)
          bad = call('POST', '/channel/mail-account/test', dict(account, imapPort=3999), ok=False)
          assert bad['code'] != 0 and '连接失败' in bad['msg'], bad
          print('连接测试正常，错误端口给出原因：', bad['msg'][:80])
          aid = call('POST', '/channel/mail-account/create', account)
          dup = call('POST', '/channel/mail-account/create', account, ok=False)
          assert dup['code'] != 0, '同一邮箱不应重复绑定'
          # 买家（已是 CRM 客户 buyer@acme-trading.example）发来询盘
          m = EmailMessage()
          m['From'] = 'Acme Buyer <buyer@acme-trading.example>'
          m['To'] = 'sales@cgch.test'
          m['Subject'] = 'Inquiry: 500 units hair dryer'
          from email.utils import make_msgid
          m['Message-ID'] = make_msgid(domain='acme-trading.example')  # 真实邮件服务器都会带 Message-ID
          m.set_content('Hello,\nPlease quote 500 units, FOB Shenzhen.\nThanks')
          m.add_alternative('<p>Hello,</p><p>Please quote <b>500 units</b>, FOB Shenzhen.</p><img src="cid:logo123">', subtype='html')
          m.get_payload()[1].add_related(tiny_png('LOGO'), 'image', 'png', cid='<logo123>')
          m.add_attachment(b'%PDF-1.4 spec sheet', maintype='application', subtype='pdf', filename='spec.pdf')
          with smtplib.SMTP('127.0.0.1', 3025) as s:
              s.send_message(m)
          time.sleep(1)
          n = call('POST', f'/channel/mail-account/sync?id={aid}')
          assert n == 1, f'应收到 1 封，实际 {n}'
          assert call('POST', f'/channel/mail-account/sync?id={aid}') == 0, '重复同步不应再入库'
          page = call('GET', f'/channel/mail-message/page?pageNo=1&pageSize=10&accountId={aid}&view=unreplied')
          assert page['total'] == 1, page
          item = page['list'][0]
          assert item['subject'] == 'Inquiry: 500 units hair dryer' and item['fromAddress'] == 'buyer@acme-trading.example', item
          assert item['customerName'] == 'Acme Buyer', f'应自动关联客户: {item}'
          assert item.get('textBody') is None, '列表不应返回正文'
          detail = call('GET', f"/channel/mail-message/get?id={item['id']}")
          assert '500 units' in (detail['textBody'] or '') and '<b>500 units</b>' in (detail['htmlBody'] or ''), detail
          assert detail['readStatus'] is True
