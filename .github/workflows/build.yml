              got = call('GET', f'/channel/mail-message/page?pageNo=1&pageSize=5&accountId={acct}&keyword=' + urllib.parse.quote('Re: New 2027'))['list']
              dbg = [(x['id'], x.get('customerId'), x.get('customerName'), x.get('sentTime'), x.get('direction')) for x in got]
              it = next(i for i in call('GET', f'/channel/reactivate/task/get?id={tid}')['items'] if i['customerName'] == 'Acme Buyer')
              raise AssertionError(f"回复未计入：来信 {dbg}；唤醒项 customerId={it['customerId']} sentTime={it['sentTime']} status={it['status']}")
          assert next(i for i in r['items'] if i['customerName'] == 'Acme Buyer')['replied'] is True
          tid2 = call('POST', '/channel/reactivate/task/create', {'customerIds': [manual['id']], 'channel': 'whatsapp'})
          t2 = wait(lambda: (lambda t: t if t['status'] == 'ready' else None)(call('GET', f'/channel/reactivate/task/get?id={tid2}')), '任务 2')
          assert t2['items'][0]['status'] == 'skipped' and '模板' in t2['items'][0]['reasonDetail'], t2['items']
          call('DELETE', f'/channel/reactivate/task/delete?id={tid2}')
          assert call('GET', '/channel/reactivate/task/page?pageNo=1&pageSize=10')['total'] == 1
          ledger_x = call('GET', '/channel/credit/ledger/page?pageNo=1&pageSize=50&type=consume')['list']
          assert any(x['remark'] == '客户唤醒' and x['channel'] == 'reactivate' for x in ledger_x)
          print('客户唤醒：筛出久未联系客户；AI 按客户写邮件、WhatsApp 用模板；确认后批量发出并跟踪回复；无模板时跳过并说明原因')

          # ---- 深度背调 ----
          def research(body):
              rid = call('POST', '/channel/research/create', body)
              return wait(lambda: (lambda x: x if x['status'] != 'running' else None)(call('GET', f'/channel/research/get?id={rid}')),
                          f'背调 {rid} 完成', timeout=30)
          assert call('POST', '/channel/research/create', {}, ok=False)['code'] != 0, '什么都没填应提示'
          bal_rs = call('GET', '/channel/credit/summary')['balance']
          rs = research({'website': '127.0.0.1:18080'})  # 不带协议，应自动补全
          assert rs['status'] == 'done', rs
          rep = rs['report']
          assert rep['companyName'] == 'Bluewave Home Appliances Ltd' and rep['businessType'] == 'distributor', rep
          assert rep['mainProducts'] and rep['purchasingSignals'] and rep['certifications'] == ['ISO 9001'], rep
          urls = [x['url'] for x in rs['sources']]
          assert any(u.endswith('/about-us') for u in urls) and any(u.endswith('/catalog') for u in urls), urls
          assert not any('/private' in u for u in urls) and '/private/plan' not in json.load(urllib.request.urlopen('http://127.0.0.1:18080/_site_hits')), 'robots.txt 禁止的页面不应访问'
          assert all(len(x['snippet']) <= 240 for x in rs['sources']), '来源只保存摘要'
          up = json.load(urllib.request.urlopen('http://127.0.0.1:18080/_llm'))[-1]['messages'][1]['content']
          assert 'Our story' in up and 'SECRET-INTERNAL' not in up and 'var x=1' not in up, up[:500]
          assert rs['credits'] >= 1 and call('GET', '/channel/credit/summary')['balance'] == bal_rs - rs['credits']
          bad = research({'website': 'http://localhost:48080'})
          assert bad['status'] == 'failed' and '内网或本机' in bad['reasonDetail'], bad
          bad2 = research({'website': 'http://10.0.0.1'})
          assert bad2['status'] == 'failed' and '内网或本机' in bad2['reasonDetail'], bad2
          print('深度背调：读取官网首页/关于/产品/联系页（跟随站内重定向、遵守 robots.txt、拒绝内网地址），AI 整理出类型、产品、采购信号')

          rc = research({'customerId': acme['id'], 'website': 'http://127.0.0.1:18080'})
          up2 = json.load(urllib.request.urlopen('http://127.0.0.1:18080/_llm'))[-1]['messages'][1]['content']
          assert '往来记录' in up2 and 'free samples' in up2, '应附上与该客户的往来邮件'
          changed = call('POST', f"/channel/research/apply?id={rc['id']}")
          assert '备注' in changed and '公司名称' not in changed, changed
          cust = call('GET', f"/crm/customer/get?id={acme['id']}")
          assert '【AI 背调' in cust['remark'] and cust['companyName'] == 'Acme Trading LLC', cust
          assert call('POST', f"/channel/research/apply?id={rc['id']}") == [], '重复应用不应重复追加'
          lid2 = call('POST', '/crm/clue/create', {'name': 'Bluewave 采购', 'ownerUserId': 1})
          rl = research({'clueId': lid2, 'website': 'http://127.0.0.1:18080'})
          ch2 = call('POST', f"/channel/research/apply?id={rl['id']}")
          assert set(['公司名称', '官网', '国家']).issubset(ch2), ch2
          clue2 = call('GET', f'/crm/clue/get?id={lid2}')
          assert clue2['companyName'] == 'Bluewave Home Appliances Ltd' and clue2['countryCode'] == 'AU' and clue2['website'].startswith('http://127.0.0.1:18080'), clue2
          assert call('GET', f"/channel/research/page?pageNo=1&pageSize=10&customerId={acme['id']}")['total'] == 1
          call('DELETE', f"/channel/research/delete?id={bad['id']}")
          ledger_rs = call('GET', '/channel/credit/ledger/page?pageNo=1&pageSize=50&type=consume')['list']
          assert any(x['remark'] == '深度背调' and x['channel'] == 'research' for x in ledger_rs)
          print('深度背调：附带往来记录；一键补充客户/线索的空字段并追加概况，重复应用不重复')
          print(f"数据看板：询盘 {c['inquiries']}、回复率 {c['replyRate']:.0%}、AI 占比 {c['aiShare']:.0%}、线索 {c['cluesCreated']}、智点 {c['creditsConsumed']}，按天与总数一致")
          print('AI 数字员工全部通过')
          PY

      - name: 后端日志
        if: always()
        run: tail -300 server.log || true

      - name: 失败时把日志摘要写成注解
        if: failure()
        run: |
          emit() {  # $1 标题  $2 文件  —— 每段 40 行写成一条注解
            [ -f "$2" ] || return 0
            grep -nE 'ERROR|Exception|Caused by|FAIL|BUILD' "$2" | tail -120 > snippet.txt || true
            [ -s snippet.txt ] || tail -120 "$2" > snippet.txt
            split -l 40 snippet.txt part_
            for f in part_*; do
              msg=$(sed 's/%/%25/g' "$f" | cut -c1-300 | awk '{printf "%s%%0A", $0}')
              echo "::error title=$1 ($f)::$msg"
            done
            rm -f part_* snippet.txt
          }
          emit build.log build.log
          if [ -f server.log ]; then
            sed 's/\x1b\[[0-9;]*m//g' server.log > clean.log
            { grep -n -A30 'APPLICATION FAILED TO START' clean.log; grep -n 'Caused by' clean.log | tail -15; \
              grep -n -A12 ' ERROR ' clean.log | grep -v '^\s*$' | tail -60; } \
              | cut -c1-900 > why.txt || true
            split -l 25 why.txt why_
            for f in why_*; do
              msg=$(sed 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
              echo "::error title=startup ($f)::$msg"
            done
          fi

  frontend:
    name: 前端类型检查 + 打包
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 启用 pnpm
        run: |
          npm i -g corepack@latest
          corepack enable
          pnpm -v

      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile

      - name: 类型检查（web-antd，上游代码存在既有类型错误，仅报告不阻断）
        continue-on-error: true
        run: pnpm -F @vben/web-antd run typecheck 2>&1 | tail -40

      - name: 打包（web-antd）
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          pnpm build:antd 2>&1 | tee ../fe-build.log; code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            msg=$(grep -nE 'error|Error|ERR' ../fe-build.log | tail -40 | sed 's/%/%25/g' | cut -c1-300 | awk '{printf "%s%%0A", $0}')
            echo "::error title=frontend build::$msg"
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: web-antd-dist
          path: frontend/apps/web-antd/dist*
          if-no-files-found: warn
