<style data-app-loading="inject-css">
  /* 启动画面（苹果风格）：LOGO 轻轻呼吸，下方细进度条；页面准备好后淡出 */
  html {
    line-height: 1.15;
  }

  .loading {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 18px;
    align-items: center;
    justify-content: center;
    background: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }

  .loading.hidden {
    visibility: hidden;
    pointer-events: none;
    opacity: 0;
    transition: all 0.5s cubic-bezier(0.32, 0.72, 0, 1);
  }

  .loading .cg-logo {
    width: 64px;
    height: 64px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgb(0 113 227 / 25%);
    animation: cg-breathe 1.8s ease-in-out infinite;
  }

  .loading .cg-name {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #1d1d1f;
  }

  .loading .cg-bar {
    position: relative;
    width: 120px;
    height: 3px;
    overflow: hidden;
    background: rgb(118 118 128 / 16%);
    border-radius: 3px;
  }

  .loading .cg-bar::after {
    position: absolute;
    inset: 0;
    width: 40%;
    content: '';
    background: #0071e3;
    border-radius: 3px;
    animation: cg-slide 1.2s cubic-bezier(0.32, 0.72, 0, 1) infinite;
  }

  @keyframes cg-breathe {
    0%,
    100% {
      transform: scale(1);
    }

    50% {
      transform: scale(1.06);
    }
  }

  @keyframes cg-slide {
    from {
      transform: translateX(-100%);
    }

    to {
      transform: translateX(260%);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .loading .cg-logo,
    .loading .cg-bar::after {
      animation: none;
    }
  }
</style>
<div class="loading" id="__app-loading__">
  <img class="cg-logo" src="/brand/logo.png" alt="" />
  <div class="cg-name">%VITE_APP_TITLE%</div>
  <div class="cg-bar"></div>
</div>
